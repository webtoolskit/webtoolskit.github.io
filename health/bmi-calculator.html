<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMI Calculator — WebToolsKit Health</title>
  <meta name="description" content="Calculate your Body Mass Index and find out if you're at a healthy weight for your height."/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#060f09;--card:#0d1f12;--border:#1a3526;--green:#00e64d;--green2:#00c43f;--glow:rgba(0,230,77,0.12);--white:#fff;--grey:#7a9e85;--light:#b8d4be}
    body{background:var(--bg);color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}
    nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(6,15,9,.96);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
    .logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;text-decoration:none;color:var(--white)}.logo span{color:var(--green)}
    .back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}
    .back-btn:hover{color:var(--white);border-color:var(--green)}
    .container{max-width:760px;margin:0 auto;padding:56px 20px}
    .tool-header{text-align:center;margin-bottom:44px}
    .tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(0,230,77,0.25)}
    .tool-header h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-1px;margin-bottom:9px}
    .tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px}
    .card h2{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:600;margin-bottom:22px;color:var(--green);text-transform:uppercase;letter-spacing:1.5px}
    .toggle-row{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:24px}
    .tog{padding:11px;background:transparent;border:none;color:var(--grey);font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s}
    .tog.active{background:var(--glow);color:var(--green)}
    .input-group{margin-bottom:18px}
    label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}
    .input-wrap{position:relative}
    .input-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--green);font-weight:700;font-size:.88rem;font-family:'JetBrains Mono',monospace}
    input[type=number]{width:100%;background:#060f09;border:1px solid var(--border);border-radius:12px;padding:13px 14px 13px 52px;color:var(--white);font-size:.97rem;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .2s}
    input[type=number]:focus{border-color:var(--green)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--green2));border:none;color:#060f09;font-size:.97rem;font-weight:800;cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:.3px;transition:opacity .2s,transform .2s}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .result-card{background:linear-gradient(135deg,rgba(0,230,77,.08),rgba(0,196,63,.04));border:1px solid rgba(0,230,77,.25);border-radius:20px;padding:32px;display:none}
    .result-card.show{display:block}
    .bmi-display{text-align:center;margin-bottom:28px}
    .bmi-label{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--grey);font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
    .bmi-number{font-family:'Syne',sans-serif;font-size:5rem;font-weight:800;letter-spacing:-3px;background:linear-gradient(90deg,var(--green),var(--green2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
    .bmi-category{font-size:1.1rem;font-weight:700;margin-top:8px}
    .bmi-scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
    .scale-item{border-radius:10px;padding:12px 8px;text-align:center;border:1px solid var(--border)}
    .scale-item.active{border-color:var(--green);background:var(--glow)}
    .scale-range{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--grey);margin-bottom:4px}
    .scale-name{font-size:.78rem;font-weight:700}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
    .r-item{background:rgba(255,255,255,.04);border-radius:12px;padding:16px;border:1px solid var(--border)}
    .r-label{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--grey);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
    .r-val{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700}
    .tip-box{padding:14px 18px;background:var(--glow);border:1px solid rgba(0,230,77,.2);border-radius:12px;font-size:.85rem;color:var(--light);line-height:1.6}
    .tip-box strong{color:var(--green)}
    @media(max-width:600px){nav{padding:14px 20px}.grid-2,.result-grid,.bmi-scale{grid-template-columns:1fr 1fr}.bmi-number{font-size:3.5rem}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Web<span>Tools</span>Kit</a>
  <a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Health Tools</a>
</nav>
<div class="container">
  <div class="tool-header">
    <div class="tool-icon-big">⚖️</div>
    <h1>BMI Calculator</h1>
    <p>Calculate your Body Mass Index instantly and understand what it means for your health.</p>
  </div>
  <div class="card">
    <h2>// Your Details</h2>
    <div class="toggle-row">
      <button class="tog active" id="togMetric" onclick="setUnit('metric')">Metric (cm, kg)</button>
      <button class="tog" id="togImperial" onclick="setUnit('imperial')">Imperial (ft, lbs)</button>
    </div>
    <div class="grid-2">
      <div class="input-group">
        <label id="heightLabel">Height (cm)</label>
        <div class="input-wrap"><span class="input-prefix" id="heightUnit">cm</span><input type="number" id="height" placeholder="170"/></div>
      </div>
      <div class="input-group">
        <label id="weightLabel">Weight (kg)</label>
        <div class="input-wrap"><span class="input-prefix" id="weightUnit">kg</span><input type="number" id="weight" placeholder="70"/></div>
      </div>
    </div>
    <button class="btn" onclick="calculate()">Calculate My BMI →</button>
  </div>
  <div class="result-card" id="result">
    <div class="bmi-display">
      <div class="bmi-label">Your BMI Score</div>
      <div class="bmi-number" id="bmiNum">0</div>
      <div class="bmi-category" id="bmiCat"></div>
    </div>
    <div class="bmi-scale">
      <div class="scale-item" id="s1"><div class="scale-range">&lt; 18.5</div><div class="scale-name">Underweight</div></div>
      <div class="scale-item" id="s2"><div class="scale-range">18.5–24.9</div><div class="scale-name">Normal</div></div>
      <div class="scale-item" id="s3"><div class="scale-range">25–29.9</div><div class="scale-name">Overweight</div></div>
      <div class="scale-item" id="s4"><div class="scale-range">≥ 30</div><div class="scale-name">Obese</div></div>
    </div>
    <div class="result-grid">
      <div class="r-item"><div class="r-label">Healthy Weight Range</div><div class="r-val" id="healthyRange">—</div></div>
      <div class="r-item"><div class="r-label">Weight to Lose/Gain</div><div class="r-val" id="weightDiff">—</div></div>
    </div>
    <div class="tip-box" id="tipBox"></div>
  </div>
</div>
<script>
let unit='metric';
function setUnit(u){unit=u;document.getElementById('togMetric').classList.toggle('active',u==='metric');document.getElementById('togImperial').classList.toggle('active',u==='imperial');document.getElementById('heightLabel').textContent=u==='metric'?'Height (cm)':'Height (ft)';document.getElementById('weightLabel').textContent=u==='metric'?'Weight (kg)':'Weight (lbs)';document.getElementById('heightUnit').textContent=u==='metric'?'cm':'ft';document.getElementById('weightUnit').textContent=u==='metric'?'kg':'lbs';}
function calculate(){
  let h=parseFloat(document.getElementById('height').value)||0;
  let w=parseFloat(document.getElementById('weight').value)||0;
  if(unit==='imperial'){h=h*30.48;w=w*0.453592;}
  const hm=h/100;const bmi=w/(hm*hm);
  const cats=[{id:'s1',max:18.5,name:'Underweight 🌱',tip:'You may need to gain some weight. Focus on nutrient-dense foods and strength training.'},{id:'s2',max:25,name:'Normal Weight ✅',tip:'Great job! You\'re at a healthy weight. Maintain it with balanced diet and regular exercise.'},{id:'s3',max:30,name:'Overweight ⚠️',tip:'Consider moderate calorie reduction and increasing physical activity to reach a healthier weight.'},{id:'s4',max:999,name:'Obese 🚨',tip:'Please consult a healthcare professional. Small sustainable lifestyle changes can make a big difference.'}];
  let cat=cats[3];for(const c of cats){if(bmi<c.max){cat=c;break;}}
  document.getElementById('bmiNum').textContent=bmi.toFixed(1);
  document.getElementById('bmiCat').textContent=cat.name;
  ['s1','s2','s3','s4'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(cat.id).classList.add('active');
  const hm2=h/100;const minW=(18.5*hm2*hm2).toFixed(1),maxW=(24.9*hm2*hm2).toFixed(1);
  document.getElementById('healthyRange').textContent=unit==='metric'?`${minW}–${maxW} kg`:`${(minW/0.453592).toFixed(0)}–${(maxW/0.453592).toFixed(0)} lbs`;
  const idealW=(22*hm2*hm2);const diff=w-idealW;
  document.getElementById('weightDiff').textContent=Math.abs(diff)<0.5?'At ideal weight!':`${Math.abs(diff).toFixed(1)}kg to ${diff>0?'lose':'gain'}`;
  document.getElementById('tipBox').innerHTML=`<strong>💡 Health Insight:</strong> ${cat.tip}`;
  const res=document.getElementById('result');res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
