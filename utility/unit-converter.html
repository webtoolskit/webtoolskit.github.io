<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Unit Converter — WebToolsKit</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#02060e;--card:#0d0810;--border:#1e0a14;--red:#c50337;--red2:#8b0227;--glow:rgba(197,3,55,0.12);--white:#fff;--grey:#9b8a92;--light:#d4c8cc}body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(2,6,14,.97);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;text-decoration:none;color:var(--white);font-style:italic}.logo span{color:var(--red)}.back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}.back-btn:hover{color:var(--white);border-color:var(--red)}.container{max-width:820px;margin:0 auto;padding:56px 20px}.tool-header{text-align:center;margin-bottom:44px}.tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--red),var(--red2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(197,3,55,.3)}.tool-header h1{font-family:'Outfit',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-.5px;margin-bottom:9px}.tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}.cat-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:24px}.ctab{padding:10px 6px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--grey);font-size:.75rem;font-weight:600;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif;transition:all .2s}.ctab.active{border-color:var(--red);color:var(--red);background:var(--glow)}.conv-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px}.conv-row{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin-bottom:20px}.input-group{margin-bottom:0}label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}input[type=number]{width:100%;background:#02060e;border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--white);font-size:1rem;font-family:'DM Mono',monospace;outline:none;transition:border-color .2s}input:focus{border-color:var(--red)}select{width:100%;background:#02060e;border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--white);font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none;margin-top:6px}select:focus{border-color:var(--red)}.swap-btn{width:44px;height:44px;border-radius:11px;background:var(--glow);border:1px solid rgba(197,3,55,.3);color:var(--red);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:6px}.result-box{background:linear-gradient(135deg,rgba(197,3,55,.1),rgba(139,2,39,.05));border:1px solid rgba(197,3,55,.25);border-radius:14px;padding:20px;text-align:center}.r-label{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}.r-val{font-family:'Outfit',sans-serif;font-size:2.5rem;font-weight:700;background:linear-gradient(90deg,var(--red),var(--red2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}@media(max-width:600px){nav{padding:14px 20px}.cat-tabs{grid-template-columns:repeat(3,1fr)}.conv-row{grid-template-columns:1fr;}.swap-btn{width:100%;height:38px}.r-val{font-size:2rem}}</style></head>
<body><nav><a href="index.html" class="logo">Web<span>Tools</span>Kit</a><a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Utility Tools</a></nav>
<div class="container"><div class="tool-header"><div class="tool-icon-big">📐</div><h1>Unit Converter</h1><p>Convert length, weight, temperature, volume, speed, and area between all major units instantly.</p></div>
<div class="cat-tabs">
  <div class="ctab active" onclick="setCategory('length',this)">📏 Length</div>
  <div class="ctab" onclick="setCategory('weight',this)">⚖️ Weight</div>
  <div class="ctab" onclick="setCategory('temperature',this)">🌡️ Temp</div>
  <div class="ctab" onclick="setCategory('volume',this)">🧪 Volume</div>
  <div class="ctab" onclick="setCategory('speed',this)">💨 Speed</div>
  <div class="ctab" onclick="setCategory('area',this)">📐 Area</div>
</div>
<div class="conv-card">
  <div class="conv-row">
    <div class="input-group"><label>Value</label><input type="number" id="inputVal" placeholder="1" oninput="convert()"/><select id="fromUnit" onchange="convert()"></select></div>
    <button class="swap-btn" onclick="swapUnits()">⇄</button>
    <div class="input-group"><label>Result</label><div class="result-box"><div class="r-label" id="resLabel">Converted Value</div><div class="r-val" id="resVal">—</div></div><select id="toUnit" onchange="convert()"></select></div>
  </div>
</div></div>
<script>
const cats={length:{units:['Metre (m)','Kilometre (km)','Centimetre (cm)','Millimetre (mm)','Mile (mi)','Yard (yd)','Foot (ft)','Inch (in)','Nautical Mile'],toBase:[1,1000,0.01,0.001,1609.34,0.9144,0.3048,0.0254,1852]},weight:{units:['Kilogram (kg)','Gram (g)','Milligram (mg)','Pound (lb)','Ounce (oz)','Tonne (t)','Stone'],toBase:[1,0.001,0.000001,0.453592,0.0283495,1000,6.35029]},temperature:{units:['Celsius (°C)','Fahrenheit (°F)','Kelvin (K)'],special:true},volume:{units:['Litre (L)','Millilitre (mL)','Cubic Metre (m³)','Gallon (gal)','Quart (qt)','Cup','Fluid Ounce (fl oz)','Tablespoon','Teaspoon'],toBase:[1,0.001,1000,3.78541,0.946353,0.236588,0.0295735,0.0147868,0.00492892]},speed:{units:['m/s','km/h','mph','knot','ft/s'],toBase:[1,0.277778,0.44704,0.514444,0.3048]},area:{units:['m²','km²','cm²','Hectare','Acre','ft²','in²','Square Mile'],toBase:[1,1000000,0.0001,10000,4046.86,0.092903,0.00064516,2589988.1]}};
let currentCat='length';
function setCategory(cat,el){currentCat=cat;document.querySelectorAll('.ctab').forEach(t=>t.classList.remove('active'));el.classList.add('active');const units=cats[cat].units;const populate=id=>{const sel=document.getElementById(id);sel.innerHTML=units.map((u,i)=>`<option value="${i}">${u}</option>`).join('');};populate('fromUnit');populate('toUnit');document.getElementById('toUnit').selectedIndex=1;convert();}
function swapUnits(){const f=document.getElementById('fromUnit').value,t=document.getElementById('toUnit').value;document.getElementById('fromUnit').value=t;document.getElementById('toUnit').value=f;convert();}
function convert(){
  const val=parseFloat(document.getElementById('inputVal').value);if(isNaN(val)){document.getElementById('resVal').textContent='—';return;}
  const fi=parseInt(document.getElementById('fromUnit').value),ti=parseInt(document.getElementById('toUnit').value);
  const cat=cats[currentCat];let result;
  if(cat.special){if(fi===0&&ti===1)result=val*9/5+32;else if(fi===0&&ti===2)result=val+273.15;else if(fi===1&&ti===0)result=(val-32)*5/9;else if(fi===1&&ti===2)result=(val-32)*5/9+273.15;else if(fi===2&&ti===0)result=val-273.15;else if(fi===2&&ti===1)result=(val-273.15)*9/5+32;else result=val;}
  else{const base=val*cat.toBase[fi];result=base/cat.toBase[ti];}
  document.getElementById('resVal').textContent=result%1===0?result.toLocaleString('en-IN'):parseFloat(result.toPrecision(8)).toLocaleString('en-IN');
  document.getElementById('resLabel').textContent=cat.units[fi]+' → '+cat.units[ti];
}
setCategory('length',document.querySelector('.ctab'));
</script></body></html>
