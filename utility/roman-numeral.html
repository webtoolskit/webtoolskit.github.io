<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Roman Numeral Converter — WebToolsKit</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#02060e;--card:#0d0810;--border:#1e0a14;--red:#c50337;--red2:#8b0227;--glow:rgba(197,3,55,0.12);--white:#fff;--grey:#9b8a92;--light:#d4c8cc}body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(2,6,14,.97);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;text-decoration:none;color:var(--white);font-style:italic}.logo span{color:var(--red)}.back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}.back-btn:hover{color:var(--white);border-color:var(--red)}.container{max-width:680px;margin:0 auto;padding:56px 20px}.tool-header{text-align:center;margin-bottom:44px}.tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--red),var(--red2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(197,3,55,.3)}.tool-header h1{font-family:'Outfit',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-.5px;margin-bottom:9px}.tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px}.card h2{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500;margin-bottom:22px;color:var(--red);text-transform:uppercase;letter-spacing:1.5px}.toggle-row{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:22px}.tog{padding:12px;background:transparent;border:none;color:var(--grey);font-size:.9rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}.tog.active{background:linear-gradient(135deg,var(--red),var(--red2));color:var(--white)}.input-group{margin-bottom:18px}label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}input{width:100%;background:#02060e;border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--white);font-size:1.1rem;font-family:'DM Mono',monospace;outline:none;transition:border-color .2s}input:focus{border-color:var(--red)}.result-display{background:linear-gradient(135deg,rgba(197,3,55,.1),rgba(139,2,39,.05));border:1px solid rgba(197,3,55,.25);border-radius:16px;padding:28px;text-align:center;margin-top:20px;display:none}.result-display.show{display:block}.r-label{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}.r-result{font-family:'Cormorant Garamond',serif;font-size:4rem;font-weight:700;letter-spacing:4px;background:linear-gradient(90deg,var(--red),var(--red2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}.ref-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}.ref-item{background:rgba(255,255,255,.04);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)}.ref-rom{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:var(--red)}.ref-num{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--grey);margin-top:3px}@media(max-width:600px){nav{padding:14px 20px}.ref-grid{grid-template-columns:repeat(4,1fr)}.r-result{font-size:2.8rem}}</style></head>
<body><nav><a href="index.html" class="logo">Web<span>Tools</span>Kit</a><a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Utility Tools</a></nav>
<div class="container"><div class="tool-header"><div class="tool-icon-big">🏛️</div><h1>Roman Numeral Converter</h1><p>Convert between numbers and Roman numerals instantly. Supports 1 to 3,999.</p></div>
<div class="card"><h2>// Convert</h2>
<div class="toggle-row"><button class="tog active" id="togN2R" onclick="setMode('n2r')">🔢 Number → Roman</button><button class="tog" id="togR2N" onclick="setMode('r2n')">🏛️ Roman → Number</button></div>
<div class="input-group"><label id="inputLabel">Enter Number (1–3999)</label><input type="text" id="inputVal" placeholder="2024" oninput="convert()"/></div>
<div class="result-display" id="result"><div class="r-label" id="resultLabel">Roman Numeral</div><div class="r-result" id="resultVal">—</div></div></div>
<div style="font-family:'DM Mono',monospace;font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">// Reference Chart</div>
<div class="ref-grid"><div class="ref-item"><div class="ref-rom">I</div><div class="ref-num">1</div></div><div class="ref-item"><div class="ref-rom">V</div><div class="ref-num">5</div></div><div class="ref-item"><div class="ref-rom">X</div><div class="ref-num">10</div></div><div class="ref-item"><div class="ref-rom">L</div><div class="ref-num">50</div></div><div class="ref-item"><div class="ref-rom">C</div><div class="ref-num">100</div></div><div class="ref-item"><div class="ref-rom">D</div><div class="ref-num">500</div></div><div class="ref-item"><div class="ref-rom">M</div><div class="ref-num">1000</div></div><div class="ref-item"><div class="ref-rom">MCM</div><div class="ref-num">1900</div></div></div>
</div>
<script>
let mode='n2r';
function setMode(m){mode=m;document.getElementById('togN2R').classList.toggle('active',m==='n2r');document.getElementById('togR2N').classList.toggle('active',m==='r2n');document.getElementById('inputLabel').textContent=m==='n2r'?'Enter Number (1–3999)':'Enter Roman Numeral';document.getElementById('inputVal').placeholder=m==='n2r'?'2024':'MMXXIV';document.getElementById('inputVal').value='';document.getElementById('result').classList.remove('show');}
const vals=[1000,900,500,400,100,90,50,40,10,9,5,4,1];const syms=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
function toRoman(n){let result='';for(let i=0;i<vals.length;i++){while(n>=vals[i]){result+=syms[i];n-=vals[i];}}return result;}
function fromRoman(s){const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};let result=0;s=s.toUpperCase();for(let i=0;i<s.length;i++){const cur=map[s[i]],next=map[s[i+1]];if(next&&cur<next){result+=next-cur;i++;}else result+=cur;}return result;}
function convert(){
  const val=document.getElementById('inputVal').value.trim();
  if(!val){document.getElementById('result').classList.remove('show');return;}
  let res;
  if(mode==='n2r'){const n=parseInt(val);if(isNaN(n)||n<1||n>3999){document.getElementById('resultVal').textContent='Invalid (1–3999)';document.getElementById('result').classList.add('show');return;}res=toRoman(n);document.getElementById('resultLabel').textContent='Roman Numeral';}
  else{res=fromRoman(val);if(isNaN(res)||res===0){document.getElementById('resultVal').textContent='Invalid Roman numeral';document.getElementById('result').classList.add('show');return;}document.getElementById('resultLabel').textContent='Arabic Number';}
  document.getElementById('resultVal').textContent=res;document.getElementById('result').classList.add('show');
}
</script></body></html>
