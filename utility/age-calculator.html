<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Age Calculator — WebToolsKit</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#02060e;--card:#0d0810;--border:#1e0a14;--red:#c50337;--red2:#8b0227;--glow:rgba(197,3,55,0.12);--white:#fff;--grey:#9b8a92;--light:#d4c8cc}body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(2,6,14,.97);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;text-decoration:none;color:var(--white);font-style:italic}.logo span{color:var(--red)}.back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}.back-btn:hover{color:var(--white);border-color:var(--red)}.container{max-width:720px;margin:0 auto;padding:56px 20px}.tool-header{text-align:center;margin-bottom:44px}.tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--red),var(--red2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(197,3,55,.3)}.tool-header h1{font-family:'Outfit',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-.5px;margin-bottom:9px}.tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px}.card h2{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500;margin-bottom:22px;color:var(--red);text-transform:uppercase;letter-spacing:1.5px}.input-group{margin-bottom:18px}label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}input[type=date]{width:100%;background:#02060e;border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--white);font-size:1rem;font-family:'DM Mono',monospace;outline:none;transition:border-color .2s;color-scheme:dark}input:focus{border-color:var(--red)}.btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--red),var(--red2));border:none;color:var(--white);font-size:.97rem;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:opacity .2s,transform .2s}.btn:hover{opacity:.9;transform:translateY(-1px)}.result-card{background:linear-gradient(135deg,rgba(197,3,55,.08),rgba(139,2,39,.04));border:1px solid rgba(197,3,55,.25);border-radius:20px;padding:32px;display:none;text-align:center}.result-card.show{display:block}.age-main{font-family:'Outfit',sans-serif;font-size:5rem;font-weight:700;letter-spacing:-3px;background:linear-gradient(90deg,var(--red),var(--red2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px}.age-label{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:24px}.r-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;text-align:left}.r-item{background:rgba(255,255,255,.04);border-radius:12px;padding:14px;border:1px solid var(--border)}.r-label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--grey);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}.r-val{font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:600}.tip-box{padding:14px 18px;background:var(--glow);border:1px solid rgba(197,3,55,.2);border-radius:12px;font-size:.85rem;color:var(--light);line-height:1.6;text-align:left}.tip-box strong{color:var(--red)}@media(max-width:600px){nav{padding:14px 20px}.r-grid{grid-template-columns:1fr 1fr}.age-main{font-size:3.5rem}}</style></head>
<body><nav><a href="index.html" class="logo">Web<span>Tools</span>Kit</a><a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Utility Tools</a></nav>
<div class="container"><div class="tool-header"><div class="tool-icon-big">🎂</div><h1>Age Calculator</h1><p>Calculate your exact age in years, months, days, hours, and minutes. Find days until your next birthday too!</p></div>
<div class="card"><h2>// Your Date of Birth</h2><div class="input-group"><label>Date of Birth</label><input type="date" id="dob"/></div><div class="input-group"><label>Calculate Age As Of</label><input type="date" id="asOf"/></div><button class="btn" onclick="calculate()">Calculate My Exact Age →</button></div>
<div class="result-card" id="result"><div class="age-label">You Are</div><div class="age-main" id="ageYears">0</div><div style="font-family:'DM Mono',monospace;font-size:.9rem;color:var(--grey);margin-bottom:24px" id="ageSub"></div>
<div class="r-grid"><div class="r-item"><div class="r-label">Total Months</div><div class="r-val" id="months">0</div></div><div class="r-item"><div class="r-label">Total Days</div><div class="r-val" id="days">0</div></div><div class="r-item"><div class="r-label">Total Hours</div><div class="r-val" id="hours">0</div></div><div class="r-item"><div class="r-label">Total Minutes</div><div class="r-val" id="minutes">0</div></div><div class="r-item"><div class="r-label">Days Until Birthday</div><div class="r-val" id="birthday">0</div></div><div class="r-item"><div class="r-label">Day You Were Born</div><div class="r-val" id="dayBorn">—</div></div></div>
<div class="tip-box" id="tipBox"></div></div></div>
<script>
function calculate(){
  const dob=new Date(document.getElementById('dob').value);
  const asOf=new Date(document.getElementById('asOf').value);
  if(isNaN(dob)||isNaN(asOf))return;
  let y=asOf.getFullYear()-dob.getFullYear(),mo=asOf.getMonth()-dob.getMonth(),d=asOf.getDate()-dob.getDate();
  if(d<0){mo--;d+=new Date(asOf.getFullYear(),asOf.getMonth(),0).getDate();}
  if(mo<0){y--;mo+=12;}
  const totalDays=Math.floor((asOf-dob)/86400000);
  const totalMonths=y*12+mo;
  const nextBday=new Date(asOf.getFullYear(),dob.getMonth(),dob.getDate());
  if(nextBday<=asOf)nextBday.setFullYear(nextBday.getFullYear()+1);
  const daysUntil=Math.ceil((nextBday-asOf)/86400000);
  const days2=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('ageYears').textContent=y+' Years';
  document.getElementById('ageSub').textContent=`${mo} months, ${d} days`;
  document.getElementById('months').textContent=totalMonths.toLocaleString('en-IN');
  document.getElementById('days').textContent=totalDays.toLocaleString('en-IN');
  document.getElementById('hours').textContent=(totalDays*24).toLocaleString('en-IN');
  document.getElementById('minutes').textContent=(totalDays*24*60).toLocaleString('en-IN');
  document.getElementById('birthday').textContent=daysUntil+' days';
  document.getElementById('dayBorn').textContent=days2[dob.getDay()];
  document.getElementById('tipBox').innerHTML=`<strong>🎂 Fun Fact:</strong> You have lived for approximately ${(totalDays*24*60*60).toLocaleString('en-IN')} seconds! Your next birthday is in ${daysUntil} days on a ${days2[nextBday.getDay()]}.`;
  const res=document.getElementById('result');res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
const t=new Date();document.getElementById('asOf').valueAsDate=t;document.getElementById('dob').max=t.toISOString().split('T')[0];
</script></body></html>
