<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Percentage to Grade Calculator — WebToolsKit Students</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#111214;--card:#1a1b1f;--border:#2a2b30;--yellow:#f5c518;--yellow2:#e6b800;--glow:rgba(245,197,24,0.12);--white:#fff;--grey:#8b8d97;--light:#d4d6e0}body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(17,18,20,.97);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}.logo{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;text-decoration:none;color:var(--white)}.logo span{color:var(--yellow)}.back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}.back-btn:hover{color:var(--white);border-color:var(--yellow)}.container{max-width:760px;margin:0 auto;padding:56px 20px}.tool-header{text-align:center;margin-bottom:44px}.tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--yellow),var(--yellow2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(245,197,24,.25)}.tool-header h1{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-1px;margin-bottom:9px}.tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px}.card h2{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500;margin-bottom:22px;color:var(--yellow);text-transform:uppercase;letter-spacing:1.5px}.input-group{margin-bottom:18px}label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}.input-wrap{position:relative}.ip{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--yellow);font-weight:500;font-size:.88rem;font-family:'DM Mono',monospace}input[type=number]{width:100%;background:#111214;border:1px solid var(--border);border-radius:12px;padding:13px 14px 13px 46px;color:var(--white);font-size:.97rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}input:focus{border-color:var(--yellow)}select{width:100%;background:#111214;border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--white);font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none}select:focus{border-color:var(--yellow)}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--yellow),var(--yellow2));border:none;color:#111214;font-size:.97rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:opacity .2s,transform .2s}.btn:hover{opacity:.9;transform:translateY(-1px)}.result-card{background:linear-gradient(135deg,rgba(245,197,24,.08),rgba(230,184,0,.04));border:1px solid rgba(245,197,24,.25);border-radius:20px;padding:32px;display:none;text-align:center}.result-card.show{display:block}.r-big{font-family:'Space Grotesk',sans-serif;font-size:5rem;font-weight:700;letter-spacing:-3px;background:linear-gradient(90deg,var(--yellow),var(--yellow2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:8px}.r-grade-name{font-size:1.2rem;font-weight:700;margin-bottom:24px}.scale-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.s-item{border-radius:10px;padding:12px 6px;text-align:center;border:1px solid var(--border);background:rgba(255,255,255,.04)}.s-item.active{border-color:var(--yellow);background:var(--glow)}.s-range{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--grey);margin-bottom:4px}.s-grade{font-size:.82rem;font-weight:700}.r-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.r-item{background:rgba(255,255,255,.04);border-radius:12px;padding:14px;border:1px solid var(--border)}.r-label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--grey);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}.r-val{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:600}.tip-box{padding:14px 18px;background:var(--glow);border:1px solid rgba(245,197,24,.2);border-radius:12px;font-size:.85rem;color:var(--light);line-height:1.6;text-align:left}.tip-box strong{color:var(--yellow)}@media(max-width:600px){nav{padding:14px 20px}.grid-2,.scale-grid,.r-grid{grid-template-columns:1fr 1fr}.r-big{font-size:3.5rem}}</style></head>
<body>
<nav><a href="index.html" class="logo">Web<span>Tools</span>Kit</a><a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Student Tools</a></nav>
<div class="container">
  <div class="tool-header"><div class="tool-icon-big">📊</div><h1>Percentage to Grade Calculator</h1><p>Enter your marks and total to get your percentage, letter grade, GPA, and grade class instantly.</p></div>
  <div class="card">
    <h2>// Your Marks</h2>
    <div class="grid-2">
      <div class="input-group"><label>Marks Obtained</label><div class="input-wrap"><span class="ip">#</span><input type="number" id="obtained" placeholder="450"/></div></div>
      <div class="input-group"><label>Total Marks</label><div class="input-wrap"><span class="ip">#</span><input type="number" id="total" placeholder="500"/></div></div>
    </div>
    <div class="input-group"><label>Grading System</label><select id="system"><option value="cbse">CBSE (10-point)</option><option value="india">Indian University Standard</option><option value="us">US Letter Grade (A-F)</option></select></div>
    <button class="btn" onclick="calculate()">Calculate My Grade →</button>
  </div>
  <div class="result-card" id="result">
    <div style="font-family:'DM Mono',monospace;font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Your Percentage</div>
    <div class="r-big" id="pct">0%</div>
    <div class="r-grade-name" id="gradeName"></div>
    <div class="scale-grid" id="scaleGrid"></div>
    <div class="r-grid">
      <div class="r-item"><div class="r-label">Letter Grade</div><div class="r-val" id="letter">—</div></div>
      <div class="r-item"><div class="r-label">GPA (4.0 scale)</div><div class="r-val" id="gpa">—</div></div>
      <div class="r-item"><div class="r-label">CGPA (10 scale)</div><div class="r-val" id="cgpa">—</div></div>
    </div>
    <div class="tip-box" id="tipBox"></div>
  </div>
</div>
<script>
function calculate(){
  const obt=parseFloat(document.getElementById('obtained').value)||0;
  const tot=parseFloat(document.getElementById('total').value)||1;
  const sys=document.getElementById('system').value;
  const pct=(obt/tot)*100;
  let letter,gpa,cgpa,name,scales;
  if(sys==='us'){
    scales=[{min:90,grade:'A',gpa:4.0,name:'Excellent'},{min:80,grade:'B',gpa:3.0,name:'Good'},{min:70,grade:'C',gpa:2.0,name:'Average'},{min:60,grade:'D',gpa:1.0,name:'Below Average'},{min:0,grade:'F',gpa:0,name:'Fail'}];
  } else {
    scales=[{min:90,grade:'O',gpa:4.0,name:'Outstanding'},{min:75,grade:'A+',gpa:3.7,name:'Excellent'},{min:65,grade:'A',gpa:3.3,name:'Very Good'},{min:55,grade:'B+',gpa:3.0,name:'Good'},{min:45,grade:'B',gpa:2.5,name:'Average'},{min:35,grade:'C',gpa:2.0,name:'Pass'},{min:0,grade:'F',gpa:0,name:'Fail'}];
  }
  const match=scales.find(s=>pct>=s.min)||scales[scales.length-1];
  cgpa=((pct/10)+0.5).toFixed(1);
  document.getElementById('pct').textContent=pct.toFixed(1)+'%';
  document.getElementById('gradeName').textContent=match.name+' — Grade '+match.grade;
  document.getElementById('letter').textContent=match.grade;
  document.getElementById('gpa').textContent=match.gpa.toFixed(1)+' / 4.0';
  document.getElementById('cgpa').textContent=Math.min(10,cgpa)+' / 10';
  document.getElementById('scaleGrid').innerHTML=scales.slice(0,6).map(s=>`<div class="s-item ${pct>=s.min&&(scales[scales.indexOf(s)-1]===undefined||pct<scales[scales.indexOf(s)-1].min)?'active':''}"><div class="s-range">${s.min}%+</div><div class="s-grade">${s.grade} — ${s.name}</div></div>`).join('');
  document.getElementById('tipBox').innerHTML=`<strong>💡 Score Context:</strong> You scored ${obt} out of ${tot} marks — that's ${pct.toFixed(1)}%. ${pct>=75?'Great score! Keep it up.':pct>=50?'Decent score. Focus on weak areas.':'Work harder next time. Analyse where you lost marks.'}`;
  const res=document.getElementById('result');res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body></html>
