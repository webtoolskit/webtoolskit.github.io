<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Body Fat Calculator — WebToolsKit Health</title><link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#060f09;--card:#0d1f12;--border:#1a3526;--green:#00e64d;--green2:#00c43f;--glow:rgba(0,230,77,0.12);--white:#fff;--grey:#7a9e85;--light:#b8d4be}body{background:var(--bg);color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(6,15,9,.96);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}.logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;text-decoration:none;color:var(--white)}.logo span{color:var(--green)}.back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}.back-btn:hover{color:var(--white);border-color:var(--green)}.container{max-width:760px;margin:0 auto;padding:56px 20px}.tool-header{text-align:center;margin-bottom:44px}.tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(0,230,77,.25)}.tool-header h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-1px;margin-bottom:9px}.tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px}.card h2{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:600;margin-bottom:22px;color:var(--green);text-transform:uppercase;letter-spacing:1.5px}.input-group{margin-bottom:18px}label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}.input-wrap{position:relative}.ip{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--green);font-weight:700;font-size:.88rem;font-family:'JetBrains Mono',monospace}input[type=number]{width:100%;background:#060f09;border:1px solid var(--border);border-radius:12px;padding:13px 14px 13px 52px;color:var(--white);font-size:.97rem;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .2s}input[type=number]:focus{border-color:var(--green)}.toggle-row{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}.tog{padding:11px;background:transparent;border:none;color:var(--grey);font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s}.tog.active{background:var(--glow);color:var(--green)}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--green2));border:none;color:#060f09;font-size:.97rem;font-weight:800;cursor:pointer;font-family:'Syne',sans-serif;transition:opacity .2s,transform .2s}.btn:hover{opacity:.9;transform:translateY(-1px)}.result-card{background:linear-gradient(135deg,rgba(0,230,77,.08),rgba(0,196,63,.04));border:1px solid rgba(0,230,77,.25);border-radius:20px;padding:32px;display:none;text-align:center}.result-card.show{display:block}.bf-num{font-family:'Syne',sans-serif;font-size:5rem;font-weight:800;letter-spacing:-3px;background:linear-gradient(90deg,var(--green),var(--green2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}.bf-label{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}.bf-cat{font-size:1.1rem;font-weight:700;margin:8px 0 24px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;text-align:left}.r-item{background:rgba(255,255,255,.04);border-radius:12px;padding:14px;border:1px solid var(--border)}.r-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--grey);font-weight:600;text-transform:uppercase;margin-bottom:5px}.r-val{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}.tip-box{padding:14px 18px;background:var(--glow);border:1px solid rgba(0,230,77,.2);border-radius:12px;font-size:.85rem;color:var(--light);line-height:1.6;text-align:left}.tip-box strong{color:var(--green)}@media(max-width:600px){nav{padding:14px 20px}.grid-2,.result-grid{grid-template-columns:1fr}.bf-num{font-size:3.5rem}}</style></head>
<body>
<nav><a href="index.html" class="logo">Web<span>Tools</span>Kit</a><a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Health Tools</a></nav>
<div class="container">
  <div class="tool-header"><div class="tool-icon-big">📊</div><h1>Body Fat Calculator</h1><p>Estimate your body fat percentage using the US Navy method — no expensive equipment needed, just a tape measure.</p></div>
  <div class="card">
    <h2>// Your Measurements</h2>
    <div class="toggle-row"><button class="tog active" id="togM" onclick="setSex('male')">♂ Male</button><button class="tog" id="togF" onclick="setSex('female')">♀ Female</button></div>
    <div class="grid-2">
      <div class="input-group"><label>Height (cm)</label><div class="input-wrap"><span class="ip">cm</span><input type="number" id="height" placeholder="175"/></div></div>
      <div class="input-group"><label>Weight (kg)</label><div class="input-wrap"><span class="ip">kg</span><input type="number" id="weight" placeholder="75"/></div></div>
      <div class="input-group"><label>Waist circumference (cm)</label><div class="input-wrap"><span class="ip">cm</span><input type="number" id="waist" placeholder="85"/></div></div>
      <div class="input-group"><label>Neck circumference (cm)</label><div class="input-wrap"><span class="ip">cm</span><input type="number" id="neck" placeholder="38"/></div></div>
    </div>
    <div class="input-group" id="hipGroup" style="display:none"><label>Hip circumference (cm) — Women only</label><div class="input-wrap"><span class="ip">cm</span><input type="number" id="hip" placeholder="95"/></div></div>
    <button class="btn" onclick="calculate()">Calculate Body Fat % →</button>
  </div>
  <div class="result-card" id="result">
    <div class="bf-label">Body Fat Percentage</div>
    <div class="bf-num" id="bfNum">0%</div>
    <div class="bf-cat" id="bfCat"></div>
    <div class="result-grid">
      <div class="r-item"><div class="r-label">Fat Mass</div><div class="r-val" id="fatMass">0 kg</div></div>
      <div class="r-item"><div class="r-label">Lean Mass</div><div class="r-val" id="leanMass">0 kg</div></div>
      <div class="r-item"><div class="r-label">Healthy Range</div><div class="r-val" id="healthyRange">—</div></div>
    </div>
    <div class="tip-box" id="tipBox"></div>
  </div>
</div>
<script>
let sex='male';
function setSex(s){sex=s;document.getElementById('togM').classList.toggle('active',s==='male');document.getElementById('togF').classList.toggle('active',s==='female');document.getElementById('hipGroup').style.display=s==='female'?'block':'none';}
function calculate(){
  const h=parseFloat(document.getElementById('height').value)||175;
  const w=parseFloat(document.getElementById('weight').value)||75;
  const waist=parseFloat(document.getElementById('waist').value)||85;
  const neck=parseFloat(document.getElementById('neck').value)||38;
  const hip=parseFloat(document.getElementById('hip').value)||95;
  let bf;
  if(sex==='male'){bf=495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(h))-450;}
  else{bf=495/(1.29579-0.35004*Math.log10(waist+hip-neck)+0.22100*Math.log10(h))-450;}
  bf=Math.max(3,Math.min(60,bf));
  const fatMass=(w*bf/100).toFixed(1);
  const leanMass=(w-parseFloat(fatMass)).toFixed(1);
  let cat,range;
  if(sex==='male'){if(bf<6)cat='Essential Fat';else if(bf<14)cat='Athletic ✅';else if(bf<18)cat='Fit ✅';else if(bf<25)cat='Average';else cat='Obese ⚠️';range='6–17%';}
  else{if(bf<14)cat='Essential Fat';else if(bf<21)cat='Athletic ✅';else if(bf<25)cat='Fit ✅';else if(bf<32)cat='Average';else cat='Obese ⚠️';range='14–24%';}
  document.getElementById('bfNum').textContent=bf.toFixed(1)+'%';
  document.getElementById('bfCat').textContent=cat;
  document.getElementById('fatMass').textContent=fatMass+' kg';
  document.getElementById('leanMass').textContent=leanMass+' kg';
  document.getElementById('healthyRange').textContent=range;
  document.getElementById('tipBox').innerHTML=`<strong>💡 Note:</strong> This uses the US Navy method — a reliable tape-measure estimate. For precise results, consult a DEXA scan or hydrostatic weighing. Focus on body composition (muscle vs fat) rather than weight alone!`;
  const res=document.getElementById('result');res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body></html>
