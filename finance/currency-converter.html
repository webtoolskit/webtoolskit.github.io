<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Converter — WebToolsKit Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0a;--card:#141414;--border:#2a2a2a;--orange:#ff5500;--orange2:#ff2200;--og:rgba(255,85,0,0.12);--white:#fff;--grey:#999}
    body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh}
    nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(10,10,10,.96);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
    .logo{font-size:1.3rem;font-weight:900;text-decoration:none;color:var(--white)}.logo span{color:var(--orange)}
    .back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}
    .back-btn:hover{color:var(--white);border-color:var(--orange)}
    .container{max-width:700px;margin:0 auto;padding:56px 20px}
    .tool-header{text-align:center;margin-bottom:44px}
    .tool-icon-big{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,var(--orange),var(--orange2));display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(255,85,0,.35)}
    .tool-header h1{font-size:1.9rem;font-weight:900;letter-spacing:-.5px;margin-bottom:9px}
    .tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px;margin-bottom:20px}
    .card h2{font-size:.9rem;font-weight:700;margin-bottom:22px;color:var(--orange);text-transform:uppercase;letter-spacing:1px}
    .conv-row{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin-bottom:22px}
    .input-group{margin-bottom:0}
    label{display:block;font-size:.85rem;font-weight:600;color:var(--grey);margin-bottom:7px}
    input[type=number],select{width:100%;background:#0a0a0a;border:1px solid var(--border);border-radius:11px;padding:13px 14px;color:var(--white);font-size:.97rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
    input[type=number]:focus,select:focus{border-color:var(--orange)}
    select option{background:#141414}
    .swap-btn{width:44px;height:44px;border-radius:11px;background:var(--og);border:1px solid rgba(255,85,0,.3);color:var(--orange);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-bottom:0}
    .swap-btn:hover{background:rgba(255,85,0,.2)}
    .btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--orange),var(--orange2));border:none;color:var(--white);font-size:.97rem;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s,transform .2s}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .result-card{background:linear-gradient(135deg,rgba(255,85,0,.1),rgba(255,34,0,.05));border:1px solid rgba(255,85,0,.3);border-radius:18px;padding:32px;display:none;text-align:center}
    .result-card.show{display:block}
    .result-number{font-size:3rem;font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,var(--orange),var(--orange2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
    .result-rate{color:var(--grey);font-size:.9rem;margin-bottom:24px}
    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .quick-item{background:rgba(255,255,255,.04);border-radius:10px;padding:12px 8px;border:1px solid var(--border);text-align:center}
    .quick-amount{font-size:.72rem;color:var(--grey);margin-bottom:4px}
    .quick-val{font-size:.9rem;font-weight:700}
    .note{margin-top:16px;font-size:.78rem;color:var(--grey);text-align:center}
    @media(max-width:600px){nav{padding:14px 20px}.conv-row{grid-template-columns:1fr;}.swap-btn{width:100%;height:38px}.quick-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Web<span>Tools</span>Kit</a>
  <a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Finance Tools</a>
</nav>
<div class="container">
  <div class="tool-header">
    <div class="tool-icon-big">💱</div>
    <h1>Currency Converter</h1>
    <p>Convert between 30+ world currencies instantly. Rates updated regularly for accuracy.</p>
  </div>
  <div class="card">
    <h2>💱 Convert Currency</h2>
    <div class="conv-row">
      <div class="input-group">
        <label>Amount</label>
        <input type="number" id="amount" placeholder="1000" value="1000"/>
      </div>
      <button class="swap-btn" onclick="swapCurrencies()" title="Swap currencies">⇄</button>
      <div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px">
      <div class="input-group">
        <label>From Currency</label>
        <select id="fromCurrency"></select>
      </div>
      <div class="input-group">
        <label>To Currency</label>
        <select id="toCurrency"></select>
      </div>
    </div>
    <button class="btn" onclick="convert()">Convert Now →</button>
  </div>
  <div class="result-card" id="result">
    <div class="result-number" id="resultNum">0</div>
    <div class="result-rate" id="resultRate"></div>
    <div class="quick-grid" id="quickGrid"></div>
    <div class="note">⚠️ Rates are indicative. For real transactions, check with your bank or exchange.</div>
  </div>
</div>
<script>
const rates={USD:1,INR:83.5,EUR:0.92,GBP:0.79,JPY:149.5,CAD:1.36,AUD:1.53,CHF:0.89,CNY:7.24,SGD:1.34,AED:3.67,SAR:3.75,MYR:4.72,THB:35.8,HKD:7.82,KRW:1325,MXN:17.2,BRL:4.97,ZAR:18.7,NOK:10.6,SEK:10.4,DKK:6.89,NZD:1.62,TRY:32.1,RUB:90.2,PKR:278,BDT:110,LKR:305,NPR:133,PHP:56.8};
const names={USD:'🇺🇸 USD - US Dollar',INR:'🇮🇳 INR - Indian Rupee',EUR:'🇪🇺 EUR - Euro',GBP:'🇬🇧 GBP - British Pound',JPY:'🇯🇵 JPY - Japanese Yen',CAD:'🇨🇦 CAD - Canadian Dollar',AUD:'🇦🇺 AUD - Australian Dollar',CHF:'🇨🇭 CHF - Swiss Franc',CNY:'🇨🇳 CNY - Chinese Yuan',SGD:'🇸🇬 SGD - Singapore Dollar',AED:'🇦🇪 AED - UAE Dirham',SAR:'🇸🇦 SAR - Saudi Riyal',MYR:'🇲🇾 MYR - Malaysian Ringgit',THB:'🇹🇭 THB - Thai Baht',HKD:'🇭🇰 HKD - Hong Kong Dollar',KRW:'🇰🇷 KRW - Korean Won',MXN:'🇲🇽 MXN - Mexican Peso',BRL:'🇧🇷 BRL - Brazilian Real',ZAR:'🇿🇦 ZAR - South African Rand',NOK:'🇳🇴 NOK - Norwegian Krone',SEK:'🇸🇪 SEK - Swedish Krona',DKK:'🇩🇰 DKK - Danish Krone',NZD:'🇳🇿 NZD - New Zealand Dollar',TRY:'🇹🇷 TRY - Turkish Lira',RUB:'🇷🇺 RUB - Russian Ruble',PKR:'🇵🇰 PKR - Pakistani Rupee',BDT:'🇧🇩 BDT - Bangladeshi Taka',LKR:'🇱🇰 LKR - Sri Lankan Rupee',NPR:'🇳🇵 NPR - Nepalese Rupee',PHP:'🇵🇭 PHP - Philippine Peso'};
const fromSel=document.getElementById('fromCurrency'),toSel=document.getElementById('toCurrency');
Object.keys(rates).forEach(c=>{
  fromSel.innerHTML+=`<option value="${c}" ${c==='INR'?'selected':''}>${names[c]}</option>`;
  toSel.innerHTML+=`<option value="${c}" ${c==='USD'?'selected':''}>${names[c]}</option>`;
});
function swapCurrencies(){const f=fromSel.value,t=toSel.value;fromSel.value=t;toSel.value=f;}
function convert(){
  const amount=parseFloat(document.getElementById('amount').value)||0;
  const from=fromSel.value,to=toSel.value;
  const inUSD=amount/rates[from];
  const result=inUSD*rates[to];
  const rate=rates[to]/rates[from];
  document.getElementById('resultNum').textContent=result.toLocaleString('en-IN',{maximumFractionDigits:2})+' '+to;
  document.getElementById('resultRate').textContent=`1 ${from} = ${rate.toFixed(4)} ${to}`;
  const quicks=[100,500,1000,5000,10000,50000,100000,500000];
  document.getElementById('quickGrid').innerHTML=quicks.map(q=>{
    const v=(q/rates[from])*rates[to];
    return `<div class="quick-item"><div class="quick-amount">${from} ${q.toLocaleString('en-IN')}</div><div class="quick-val">${v.toLocaleString('en-IN',{maximumFractionDigits:0})} ${to}</div></div>`;
  }).join('');
  const res=document.getElementById('result');res.classList.add('show');
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
