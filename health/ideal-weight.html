t-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:600;margin-bottom:22px;color:var(--green);text-transform:uppercase;letter-spacing:1.5px}.input-group{margin-bottom:18px}label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}.input-wrap{position:relative}.input-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--green);font-weight:700;font-size:.88rem;font-family:'JetBrains Mono',monospace}input[type=number]{width:100%;background:#060f09;border:1px solid var(--border);border-radius:12px;padding:13px 14px 13px 52px;color:var(--white);font-size:.97rem;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .2s}input[type=number]:focus{border-color:var(--green)}.toggle-row{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:24px}.tog{padding:11px;background:transparent;border:none;color:var(--grey);font-size:.9rem;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s}.tog.active{background:var(--glow);color:var(--green)}.btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--green2));border:none;color:#060f09;font-size:.97rem;font-weight:800;cursor:pointer;font-family:'Syne',sans-serif;transition:opacity .2s,transform .2s}.btn:hover{opacity:.9;transform:translateY(-1px)}.result-card{background:linear-gradient(135deg,rgba(0,230,77,.08),rgba(0,196,63,.04));border:1px solid rgba(0,230,77,.25);border-radius:20px;padding:32px;display:none}.result-card.show{display:block}.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.f-item{background:rgba(255,255,255,.04);border-radius:14px;padding:18px;border:1px solid var(--border);text-align:center}.f-name{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--grey);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}.f-val{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;background:linear-gradient(90deg,var(--green),var(--green2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.f-range{font-size:.75rem;color:var(--grey);margin-top:4px}.tip-box{padding:14px 18px;background:var(--glow);border:1px solid rgba(0,230,77,.2);border-radius:12px;font-size:.85rem;color:var(--light);line-height:1.6}.tip-box strong{color:var(--green)}@media(max-width:600px){nav{padding:14px 20px}.formula-grid{grid-template-columns:1fr}}</style></head>
<body>
<nav><a href="index.html" class="logo">Web<span>Tools</span>Kit</a><a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Health Tools</a></nav>
<div class="container">
  <div class="tool-header"><div class="tool-icon-big">🎯</div><h1>Ideal Weight Calculator</h1><p>Find your ideal body weight using 4 different scientific formulas. Get a realistic, healthy target weight.</p></div>
  <div class="card">
    <h2>// Your Details</h2>
    <div class="toggle-row"><button class="tog active" id="togM" onclick="setSex('male')">♂ Male</button><button class="tog" id="togF" onclick="setSex('female')">♀ Female</button></div>
    <div class="input-group"><label>Height (cm)</label><div class="input-wrap"><span class="input-prefix">cm</span><input type="number" id="height" placeholder="170"/></div></div>
    <button class="btn" onclick="calculate()">Find My Ideal Weight →</button>
  </div>
  <div class="result-card" id="result">
    <div class="formula-grid" id="formulaGrid"></div>
    <div class="tip-box" id="tipBox"></div>
  </div>
</div>
<script>
let sex='male';
function setSex(s){sex=s;document.getElementById('togM').classList.toggle('active',s==='male');document.getElementById('togF').classList.toggle('active',s==='female');}
function calculate(){
  const h=parseFloat(document.getElementById('height').value)||170;
  const hin=(h/2.54);const over=hin>60?hin-60:0;
  const devine=sex==='male'?50+2.3*over:45.5+2.3*over;
  const robinson=sex==='male'?52+1.9*over:49+1.7*over;
  const miller=sex==='male'?56.2+1.41*over:53.1+1.36*over;
  const hamwi=sex==='male'?48+2.7*over:45.4+2.27*over;
  const avg=((devine+robinson+miller+hamwi)/4).toFixed(1);
  const formulas=[{name:'Devine Formula',val:devine},{name:'Robinson Formula',val:robinson},{name:'Miller Formula',val:miller},{name:'Hamwi Formula',val:hamwi}];
  document.getElementById('formulaGrid').innerHTML=formulas.map(f=>`<div class="f-item"><div class="f-name">${f.name}</div><div class="f-val">${f.val.toFixed(1)} kg</div><div class="f-range">${(f.val-2).toFixed(0)}–${(f.val+2).toFixed(0)} kg range</div></div>`).join('');
  document.getElementById('tipBox').innerHTML=`<strong>💡 Average across all formulas: ${avg} kg</strong><br>These are mathematical estimates based on height alone. Your actual ideal weight depends on muscle mass, bone density, and body composition. Focus on being healthy and strong, not just a number!`;
  const res=document.getElementById('result');res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body></html>
