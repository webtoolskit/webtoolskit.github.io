<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Attendance Calculator — WebToolsKit Students</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#111214;--card:#1a1b1f;--border:#2a2b30;--yellow:#f5c518;--yellow2:#e6b800;--glow:rgba(245,197,24,0.12);--white:#fff;--grey:#8b8d97;--light:#d4d6e0}body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(17,18,20,.97);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}.logo{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;text-decoration:none;color:var(--white)}.logo span{color:var(--yellow)}.back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}.back-btn:hover{color:var(--white);border-color:var(--yellow)}.container{max-width:760px;margin:0 auto;padding:56px 20px}.tool-header{text-align:center;margin-bottom:44px}.tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--yellow),var(--yellow2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(245,197,24,.25)}.tool-header h1{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-1px;margin-bottom:9px}.tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px}.card h2{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500;margin-bottom:22px;color:var(--yellow);text-transform:uppercase;letter-spacing:1.5px}.input-group{margin-bottom:18px}label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}.input-wrap{position:relative}.ip{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--yellow);font-weight:500;font-size:.88rem;font-family:'DM Mono',monospace}input[type=number]{width:100%;background:#111214;border:1px solid var(--border);border-radius:12px;padding:13px 14px 13px 46px;color:var(--white);font-size:.97rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}input:focus{border-color:var(--yellow)}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.toggle-row{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:22px}.tog{padding:12px;background:transparent;border:none;color:var(--grey);font-size:.9rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}.tog.active{background:var(--glow);color:var(--yellow)}.btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--yellow),var(--yellow2));border:none;color:#111214;font-size:.97rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:opacity .2s,transform .2s}.btn:hover{opacity:.9;transform:translateY(-1px)}.result-card{border-radius:20px;padding:32px;display:none;text-align:center}.result-card.show{display:block}.result-card.safe{background:linear-gradient(135deg,rgba(245,197,24,.08),rgba(230,184,0,.04));border:1px solid rgba(245,197,24,.25)}.result-card.danger{background:linear-gradient(135deg,rgba(255,50,50,.08),rgba(200,30,30,.04));border:1px solid rgba(255,50,50,.25)}.r-big{font-family:'Space Grotesk',sans-serif;font-size:5rem;font-weight:700;letter-spacing:-3px;line-height:1;margin-bottom:8px}.r-big.yellow{background:linear-gradient(90deg,var(--yellow),var(--yellow2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.r-big.red{color:#ff4444}.r-status{font-size:1.1rem;font-weight:700;margin-bottom:24px}.r-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.r-item{background:rgba(255,255,255,.04);border-radius:12px;padding:14px;border:1px solid var(--border)}.r-label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--grey);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}.r-val{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:600}.tip-box{padding:14px 18px;background:var(--glow);border:1px solid rgba(245,197,24,.2);border-radius:12px;font-size:.85rem;color:var(--light);line-height:1.6;text-align:left}.tip-box strong{color:var(--yellow)}@media(max-width:600px){nav{padding:14px 20px}.grid-2,.r-grid{grid-template-columns:1fr}.r-big{font-size:3.5rem}}</style></head>
<body>
<nav><a href="index.html" class="logo">Web<span>Tools</span>Kit</a><a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Student Tools</a></nav>
<div class="container">
  <div class="tool-header"><div class="tool-icon-big">✅</div><h1>Attendance Calculator</h1><p>Know exactly how many classes you can miss while staying safe — or how many you must attend to recover your attendance.</p></div>
  <div class="card">
    <h2>// Your Attendance</h2>
    <div class="toggle-row"><button class="tog active" id="modeSkip" onclick="setMode('skip')">😴 How many can I skip?</button><button class="tog" id="modeRecover" onclick="setMode('recover')">📈 How to recover?</button></div>
    <div class="grid-2">
      <div class="input-group"><label>Classes Attended</label><div class="input-wrap"><span class="ip">#</span><input type="number" id="attended" placeholder="45"/></div></div>
      <div class="input-group"><label>Total Classes Held</label><div class="input-wrap"><span class="ip">#</span><input type="number" id="total" placeholder="60"/></div></div>
      <div class="input-group"><label>Remaining Classes This Semester</label><div class="input-wrap"><span class="ip">#</span><input type="number" id="remaining" placeholder="20"/></div></div>
      <div class="input-group"><label>Required Attendance (%)</label><div class="input-wrap"><span class="ip">%</span><input type="number" id="required" placeholder="75" value="75"/></div></div>
    </div>
    <button class="btn" onclick="calculate()">Calculate My Attendance →</button>
  </div>
  <div class="result-card" id="result">
    <div style="font-family:'DM Mono',monospace;font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Current Attendance</div>
    <div class="r-big" id="currentPct">0%</div>
    <div class="r-status" id="status"></div>
    <div class="r-grid">
      <div class="r-item"><div class="r-label">Can Still Skip</div><div class="r-val" id="canSkip">0</div></div>
      <div class="r-item"><div class="r-label">Must Attend</div><div class="r-val" id="mustAttend">0</div></div>
      <div class="r-item"><div class="r-label">After Full Attend</div><div class="r-val" id="afterFull">0%</div></div>
    </div>
    <div class="tip-box" id="tipBox"></div>
  </div>
</div>
<script>
let mode='skip';
function setMode(m){mode=m;document.getElementById('modeSkip').classList.toggle('active',m==='skip');document.getElementById('modeRecover').classList.toggle('active',m==='recover');}
function calculate(){
  const att=parseFloat(document.getElementById('attended').value)||0;
  const tot=parseFloat(document.getElementById('total').value)||1;
  const rem=parseFloat(document.getElementById('remaining').value)||0;
  const req=parseFloat(document.getElementById('required').value)||75;
  const cur=att/tot*100;
  const totalFuture=tot+rem;
  const minNeeded=Math.ceil(req*totalFuture/100);
  const alreadyHave=att;
  const mustAttend=Math.max(0,minNeeded-alreadyHave);
  const canSkip=Math.max(0,rem-mustAttend);
  const afterFull=(att+rem)/(tot+rem)*100;
  const isSafe=cur>=req;
  document.getElementById('currentPct').textContent=cur.toFixed(1)+'%';
  document.getElementById('currentPct').className='r-big '+(isSafe?'yellow':'red');
  document.getElementById('status').textContent=isSafe?'✅ You are safe!':'⚠️ Below required attendance!';
  document.getElementById('canSkip').textContent=canSkip+' classes';
  document.getElementById('mustAttend').textContent=mustAttend+' classes';
  document.getElementById('afterFull').textContent=afterFull.toFixed(1)+'%';
  const res=document.getElementById('result');
  res.className='result-card show '+(isSafe?'safe':'danger');
  document.getElementById('tipBox').innerHTML=isSafe?`<strong>💡 You're Safe!</strong> You can skip up to ${canSkip} more classes. But attend at least ${mustAttend} of the remaining ${rem} to stay above ${req}%.`:`<strong>⚠️ Danger Zone!</strong> You need to attend at least ${mustAttend} of the remaining ${rem} classes to reach ${req}% attendance. Don't miss any more!`;
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body></html>
