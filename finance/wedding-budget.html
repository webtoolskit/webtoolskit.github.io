<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding Budget Allocator — WebToolsKit Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0a;--card:#141414;--border:#2a2a2a;--orange:#ff5500;--orange2:#ff2200;--og:rgba(255,85,0,0.12);--white:#fff;--grey:#999}
    body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;min-height:100vh}
    nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(10,10,10,.96);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
    .logo{font-size:1.3rem;font-weight:900;text-decoration:none;color:var(--white)}.logo span{color:var(--orange)}
    .back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}
    .back-btn:hover{color:var(--white);border-color:var(--orange)}
    .container{max-width:820px;margin:0 auto;padding:56px 20px}
    .tool-header{text-align:center;margin-bottom:44px}
    .tool-icon-big{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,var(--orange),var(--orange2));display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(255,85,0,.35)}
    .tool-header h1{font-size:1.9rem;font-weight:900;letter-spacing:-.5px;margin-bottom:9px}
    .tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:32px;margin-bottom:20px}
    .card h2{font-size:.9rem;font-weight:700;margin-bottom:22px;color:var(--orange);text-transform:uppercase;letter-spacing:1px}
    .input-group{margin-bottom:18px}
    label{display:block;font-size:.85rem;font-weight:600;color:var(--grey);margin-bottom:7px}
    .input-wrap{position:relative}
    .input-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--orange);font-weight:700;font-size:.9rem}
    input[type=number]{width:100%;background:#0a0a0a;border:1px solid var(--border);border-radius:11px;padding:13px 14px 13px 44px;color:var(--white);font-size:.97rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
    input[type=number]:focus{border-color:var(--orange)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .priority-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
    .pri-btn{padding:10px 8px;background:#0a0a0a;border:1px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
    .pri-btn.active{background:var(--og);border-color:var(--orange)}
    .pri-icon{font-size:1.3rem;margin-bottom:4px}
    .pri-label{font-size:.72rem;color:var(--grey);font-weight:600}
    .pri-btn.active .pri-label{color:var(--orange)}
    .btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--orange),var(--orange2));border:none;color:var(--white);font-size:.97rem;font-weight:800;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .2s,transform .2s}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .result-card{background:linear-gradient(135deg,rgba(255,85,0,.1),rgba(255,34,0,.05));border:1px solid rgba(255,85,0,.3);border-radius:18px;padding:32px;display:none}
    .result-card.show{display:block}
    .total-banner{text-align:center;margin-bottom:24px}
    .t-label{font-size:.78rem;color:var(--grey);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .t-big{font-size:2.8rem;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(90deg,var(--orange),var(--orange2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .alloc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
    .alloc-item{background:rgba(255,255,255,.04);border-radius:12px;padding:16px;border:1px solid var(--border)}
    .alloc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .alloc-name{font-size:.82rem;font-weight:700}
    .alloc-pct{font-size:.75rem;color:var(--orange);font-weight:700}
    .alloc-amount{font-size:1.1rem;font-weight:900;margin-bottom:6px}
    .alloc-bar{height:4px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden}
    .alloc-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:100px}
    .tip-box{padding:14px 18px;background:var(--og);border:1px solid rgba(255,85,0,.2);border-radius:11px;font-size:.85rem;color:#ccc;line-height:1.6}
    .tip-box strong{color:var(--orange)}
    @media(max-width:600px){nav{padding:14px 20px}.grid-2,.priority-grid,.alloc-grid{grid-template-columns:1fr 1fr}.priority-grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Web<span>Tools</span>Kit</a>
  <a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Finance Tools</a>
</nav>
<div class="container">
  <div class="tool-header">
    <div class="tool-icon-big">💍</div>
    <h1>Wedding Budget Allocator</h1>
    <p>Enter your total wedding budget, pick your priorities, and get a smart category-wise allocation instantly.</p>
  </div>
  <div class="card">
    <h2>💰 Budget & Details</h2>
    <div class="grid-2">
      <div class="input-group"><label>Total Wedding Budget</label><div class="input-wrap"><span class="input-prefix">₹</span><input type="number" id="budget" placeholder="1500000" value="1500000"/></div></div>
      <div class="input-group"><label>Number of Guests</label><div class="input-wrap"><span class="input-prefix">#</span><input type="number" id="guests" placeholder="200" value="200"/></div></div>
    </div>
    <label style="margin-bottom:12px;display:block">What matters most to you? (Select top priorities)</label>
    <div class="priority-grid">
      <div class="pri-btn active" onclick="togglePri(this,'venue')"><div class="pri-icon">🏛️</div><div class="pri-label">Venue</div></div>
      <div class="pri-btn active" onclick="togglePri(this,'food')"><div class="pri-icon">🍽️</div><div class="pri-label">Food</div></div>
      <div class="pri-btn" onclick="togglePri(this,'photo')"><div class="pri-icon">📸</div><div class="pri-label">Photography</div></div>
      <div class="pri-btn" onclick="togglePri(this,'decor')"><div class="pri-icon">💐</div><div class="pri-label">Decor</div></div>
      <div class="pri-btn" onclick="togglePri(this,'outfits')"><div class="pri-icon">👗</div><div class="pri-label">Outfits</div></div>
      <div class="pri-btn" onclick="togglePri(this,'music')"><div class="pri-icon">🎵</div><div class="pri-label">Music/DJ</div></div>
    </div>
    <button class="btn" onclick="calculate()">Allocate My Wedding Budget →</button>
  </div>
  <div class="result-card" id="result">
    <div class="total-banner">
      <div class="t-label">Your Total Wedding Budget</div>
      <div class="t-big" id="totalShow">₹0</div>
    </div>
    <div class="alloc-grid" id="allocGrid"></div>
    <div class="tip-box" id="tipBox"></div>
  </div>
</div>
<script>
let priorities=new Set(['venue','food']);
function togglePri(btn,key){btn.classList.toggle('active');priorities.has(key)?priorities.delete(key):priorities.add(key);}
function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
function calculate(){
  const budget=parseFloat(document.getElementById('budget').value)||0;
  const guests=parseFloat(document.getElementById('guests').value)||100;
  const base={
    venue:{name:'Venue & Hall',icon:'🏛️',pct:25},
    food:{name:'Catering & Food',icon:'🍽️',pct:30},
    photo:{name:'Photography & Video',icon:'📸',pct:10},
    decor:{name:'Decor & Flowers',icon:'💐',pct:10},
    outfits:{name:'Outfits & Jewellery',icon:'👗',pct:8},
    music:{name:'Music & Entertainment',icon:'🎵',pct:5},
    invites:{name:'Invitations & Stationery',icon:'📩',pct:2},
    transport:{name:'Transport & Logistics',icon:'🚗',pct:3},
    makeup:{name:'Makeup & Grooming',icon:'💄',pct:3},
    contingency:{name:'Contingency Fund',icon:'🛡️',pct:4}
  };
  priorities.forEach(k=>{if(base[k])base[k].pct+=5;});
  const totalBase=Object.values(base).reduce((s,c)=>s+c.pct,0);
  document.getElementById('totalShow').textContent=fmt(budget);
  let html='';
  Object.values(base).forEach(c=>{
    const pct=c.pct/totalBase*100;const amount=budget*pct/100;
    html+=`<div class="alloc-item"><div class="alloc-header"><span class="alloc-name">${c.icon} ${c.name}</span><span class="alloc-pct">${pct.toFixed(0)}%</span></div><div class="alloc-amount">${fmt(amount)}</div><div class="alloc-bar"><div class="alloc-fill" style="width:${pct}%"></div></div></div>`;
  });
  document.getElementById('allocGrid').innerHTML=html;
  const perHead=budget/guests;
  document.getElementById('tipBox').innerHTML=`<strong>💡 Per Guest Cost:</strong> With ${guests} guests, your cost per head is <strong>${fmt(perHead)}</strong>. The food budget of ${fmt(budget*(base.food.pct/totalBase*100)/100)} works out to ${fmt(budget*(base.food.pct/totalBase*100)/100/guests)} per guest — ensure your caterer can match this.`;
  const res=document.getElementById('result');res.classList.add('show');
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
