<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CGPA Calculator — WebToolsKit Students</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#111214;--card:#1a1b1f;--border:#2a2b30;--yellow:#f5c518;--yellow2:#e6b800;--glow:rgba(245,197,24,0.12);--white:#fff;--grey:#8b8d97;--light:#d4d6e0}
    body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}
    nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(17,18,20,.97);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
    .logo{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;text-decoration:none;color:var(--white)}.logo span{color:var(--yellow)}
    .back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}
    .back-btn:hover{color:var(--white);border-color:var(--yellow)}
    .container{max-width:820px;margin:0 auto;padding:56px 20px}
    .tool-header{text-align:center;margin-bottom:44px}
    .tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--yellow),var(--yellow2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(245,197,24,.25)}
    .tool-header h1{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-1px;margin-bottom:9px}
    .tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px}
    .card h2{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500;margin-bottom:22px;color:var(--yellow);text-transform:uppercase;letter-spacing:1.5px}
    .subject-row{display:grid;grid-template-columns:2fr 1fr 1fr 44px;gap:10px;align-items:center;margin-bottom:10px}
    input[type=text],input[type=number]{width:100%;background:#111214;border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--white);font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
    input:focus{border-color:var(--yellow)}
    select{width:100%;background:#111214;border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--white);font-size:.88rem;font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none}
    select:focus{border-color:var(--yellow)}
    .del-btn{width:44px;height:42px;background:rgba(255,50,50,.1);border:1px solid rgba(255,50,50,.2);border-radius:9px;color:#ff4444;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
    .add-btn{width:100%;padding:11px;background:transparent;border:1px dashed var(--border);border-radius:10px;color:var(--grey);font-size:.88rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;margin-top:4px}
    .add-btn:hover{border-color:var(--yellow);color:var(--yellow)}
    .btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--yellow),var(--yellow2));border:none;color:#111214;font-size:.97rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:opacity .2s,transform .2s;margin-top:16px}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .result-card{background:linear-gradient(135deg,rgba(245,197,24,.08),rgba(230,184,0,.04));border:1px solid rgba(245,197,24,.25);border-radius:20px;padding:32px;display:none;text-align:center}
    .result-card.show{display:block}
    .r-big-label{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
    .r-big{font-family:'Space Grotesk',sans-serif;font-size:5rem;font-weight:700;letter-spacing:-3px;background:linear-gradient(90deg,var(--yellow),var(--yellow2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:6px}
    .r-grade{font-size:1.2rem;font-weight:700;margin-bottom:24px}
    .r-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
    .r-item{background:rgba(255,255,255,.04);border-radius:12px;padding:14px;border:1px solid var(--border)}
    .r-label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--grey);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
    .r-val{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;font-weight:600}
    .tip-box{padding:14px 18px;background:var(--glow);border:1px solid rgba(245,197,24,.2);border-radius:12px;font-size:.85rem;color:var(--light);line-height:1.6;text-align:left}
    .tip-box strong{color:var(--yellow)}
    @media(max-width:600px){nav{padding:14px 20px}.subject-row{grid-template-columns:1fr 80px 80px 40px}.r-grid{grid-template-columns:1fr 1fr}.r-big{font-size:3.5rem}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Web<span>Tools</span>Kit</a>
  <a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Student Tools</a>
</nav>
<div class="container">
  <div class="tool-header">
    <div class="tool-icon-big">🎓</div>
    <h1>CGPA / GPA Calculator</h1>
    <p>Calculate your semester GPA and cumulative CGPA. Add all subjects with credits for a precise result.</p>
  </div>
  <div class="card">
    <h2>// Your Subjects</h2>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 44px;gap:10px;margin-bottom:8px;padding:0 2px">
      <div style="font-size:.75rem;color:var(--grey);font-weight:600">Subject Name</div>
      <div style="font-size:.75rem;color:var(--grey);font-weight:600">Credits</div>
      <div style="font-size:.75rem;color:var(--grey);font-weight:600">Grade</div>
      <div></div>
    </div>
    <div id="subjectList">
      <div class="subject-row"><input type="text" placeholder="Mathematics" class="sname"/><input type="number" placeholder="4" class="credits"/><select class="grade"><option value="10">O (10)</option><option value="9">A+ (9)</option><option value="8" selected>A (8)</option><option value="7">B+ (7)</option><option value="6">B (6)</option><option value="5">C (5)</option><option value="4">D (4)</option><option value="0">F (0)</option></select><button class="del-btn" onclick="removeRow(this)">×</button></div>
      <div class="subject-row"><input type="text" placeholder="Physics" class="sname"/><input type="number" placeholder="3" class="credits"/><select class="grade"><option value="10">O (10)</option><option value="9" selected>A+ (9)</option><option value="8">A (8)</option><option value="7">B+ (7)</option><option value="6">B (6)</option><option value="5">C (5)</option><option value="4">D (4)</option><option value="0">F (0)</option></select><button class="del-btn" onclick="removeRow(this)">×</button></div>
      <div class="subject-row"><input type="text" placeholder="Chemistry" class="sname"/><input type="number" placeholder="3" class="credits"/><select class="grade"><option value="10">O (10)</option><option value="9">A+ (9)</option><option value="8">A (8)</option><option value="7" selected>B+ (7)</option><option value="6">B (6)</option><option value="5">C (5)</option><option value="4">D (4)</option><option value="0">F (0)</option></select><button class="del-btn" onclick="removeRow(this)">×</button></div>
    </div>
    <button class="add-btn" onclick="addRow()">+ Add Subject</button>
    <button class="btn" onclick="calculate()">Calculate My GPA / CGPA →</button>
  </div>
  <div class="result-card" id="result">
    <div class="r-big-label">Your CGPA</div>
    <div class="r-big" id="cgpa">0.00</div>
    <div class="r-grade" id="gradeClass"></div>
    <div class="r-grid">
      <div class="r-item"><div class="r-label">Total Credits</div><div class="r-val" id="totalCredits">0</div></div>
      <div class="r-item"><div class="r-label">Grade Points</div><div class="r-val" id="gradePoints">0</div></div>
      <div class="r-item"><div class="r-label">Percentage (~)</div><div class="r-val" id="percentage">0%</div></div>
    </div>
    <div class="tip-box" id="tipBox"></div>
  </div>
</div>
<script>
function addRow(){
  const row=document.createElement('div');row.className='subject-row';
  row.innerHTML=`<input type="text" placeholder="Subject name" class="sname"/><input type="number" placeholder="3" class="credits"/><select class="grade"><option value="10">O (10)</option><option value="9">A+ (9)</option><option value="8" selected>A (8)</option><option value="7">B+ (7)</option><option value="6">B (6)</option><option value="5">C (5)</option><option value="4">D (4)</option><option value="0">F (0)</option></select><button class="del-btn" onclick="removeRow(this)">×</button>`;
  document.getElementById('subjectList').appendChild(row);
}
function removeRow(btn){const rows=document.querySelectorAll('.subject-row');if(rows.length>1)btn.closest('.subject-row').remove();}
function calculate(){
  let totalCredits=0,totalPoints=0;
  document.querySelectorAll('.subject-row').forEach(row=>{
    const credits=parseFloat(row.querySelector('.credits').value)||0;
    const grade=parseFloat(row.querySelector('.grade').value)||0;
    totalCredits+=credits;totalPoints+=credits*grade;
  });
  const cgpa=totalCredits>0?totalPoints/totalCredits:0;
  const pct=(cgpa-0.5)*10;
  let cls='';
  if(cgpa>=9)cls='🏆 Outstanding — First Class with Distinction';
  else if(cgpa>=8)cls='⭐ Excellent — First Class';
  else if(cgpa>=7)cls='✅ Good — Second Class';
  else if(cgpa>=6)cls='📘 Average — Pass Class';
  else cls='⚠️ Below average — needs improvement';
  document.getElementById('cgpa').textContent=cgpa.toFixed(2);
  document.getElementById('gradeClass').textContent=cls;
  document.getElementById('totalCredits').textContent=totalCredits;
  document.getElementById('gradePoints').textContent=totalPoints.toFixed(1);
  document.getElementById('percentage').textContent=Math.min(100,Math.max(0,pct)).toFixed(1)+'%';
  document.getElementById('tipBox').innerHTML=`<strong>💡 Formula Used:</strong> CGPA = Total Grade Points ÷ Total Credits. Percentage ≈ (CGPA × 10) - 5. This follows the standard 10-point grading system used by most Indian universities.`;
  const res=document.getElementById('result');res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
