<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calorie Burn Estimator — WebToolsKit Health</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#060f09;--card:#0d1f12;--border:#1a3526;--green:#00e64d;--green2:#00c43f;--glow:rgba(0,230,77,0.12);--white:#fff;--grey:#7a9e85;--light:#b8d4be}
    body{background:var(--bg);color:var(--white);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}
    nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(6,15,9,.96);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
    .logo{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;text-decoration:none;color:var(--white)}.logo span{color:var(--green)}
    .back-btn{display:flex;align-items:center;gap:7px;color:var(--grey);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid var(--border);padding:7px 14px;border-radius:8px;transition:all .2s}
    .back-btn:hover{color:var(--white);border-color:var(--green)}
    .container{max-width:760px;margin:0 auto;padding:56px 20px}
    .tool-header{text-align:center;margin-bottom:44px}
    .tool-icon-big{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px;box-shadow:0 10px 28px rgba(0,230,77,.25)}
    .tool-header h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-1px;margin-bottom:9px}
    .tool-header p{color:var(--grey);font-size:.96rem;line-height:1.6}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;margin-bottom:20px}
    .card h2{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:600;margin-bottom:22px;color:var(--green);text-transform:uppercase;letter-spacing:1.5px}
    .input-group{margin-bottom:18px}
    label{display:block;font-size:.84rem;font-weight:600;color:var(--grey);margin-bottom:7px}
    .input-wrap{position:relative}
    .input-prefix{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--green);font-weight:700;font-size:.88rem;font-family:'JetBrains Mono',monospace}
    input[type=number]{width:100%;background:#060f09;border:1px solid var(--border);border-radius:12px;padding:13px 14px 13px 52px;color:var(--white);font-size:.97rem;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .2s}
    input[type=number]:focus{border-color:var(--green)}
    select{width:100%;background:#060f09;border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--white);font-size:.9rem;font-family:'Plus Jakarta Sans',sans-serif;outline:none;-webkit-appearance:none}
    select:focus{border-color:var(--green)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .btn{width:100%;padding:15px;border-radius:13px;background:linear-gradient(135deg,var(--green),var(--green2));border:none;color:#060f09;font-size:.97rem;font-weight:800;cursor:pointer;font-family:'Syne',sans-serif;transition:opacity .2s,transform .2s}
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .result-card{background:linear-gradient(135deg,rgba(0,230,77,.08),rgba(0,196,63,.04));border:1px solid rgba(0,230,77,.25);border-radius:20px;padding:32px;display:none;text-align:center}
    .result-card.show{display:block}
    .cal-num{font-family:'Syne',sans-serif;font-size:5rem;font-weight:800;letter-spacing:-3px;background:linear-gradient(90deg,var(--green),var(--green2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
    .cal-label{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--grey);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
    .cal-sub{color:var(--grey);font-size:.9rem;margin:8px 0 24px}
    .result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;text-align:left}
    .r-item{background:rgba(255,255,255,.04);border-radius:12px;padding:14px;border:1px solid var(--border)}
    .r-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--grey);font-weight:600;text-transform:uppercase;margin-bottom:5px}
    .r-val{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700}
    .tip-box{padding:14px 18px;background:var(--glow);border:1px solid rgba(0,230,77,.2);border-radius:12px;font-size:.85rem;color:var(--light);line-height:1.6;text-align:left}
    .tip-box strong{color:var(--green)}
    @media(max-width:600px){nav{padding:14px 20px}.grid-2,.result-grid{grid-template-columns:1fr}.cal-num{font-size:3.5rem}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Web<span>Tools</span>Kit</a>
  <a href="index.html" class="back-btn"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Health Tools</a>
</nav>
<div class="container">
  <div class="tool-header">
    <div class="tool-icon-big">🔥</div>
    <h1>Calorie Burn Estimator</h1>
    <p>Find out exactly how many calories you burn during any physical activity based on your weight and duration.</p>
  </div>
  <div class="card">
    <h2>// Activity Details</h2>
    <div class="grid-2">
      <div class="input-group">
        <label>Your Weight (kg)</label>
        <div class="input-wrap"><span class="input-prefix">kg</span><input type="number" id="weight" placeholder="70"/></div>
      </div>
      <div class="input-group">
        <label>Duration (minutes)</label>
        <div class="input-wrap"><span class="input-prefix">min</span><input type="number" id="duration" placeholder="30"/></div>
      </div>
    </div>
    <div class="input-group">
      <label>Activity Type</label>
      <select id="activity">
        <option value="3.5">🚶 Walking (slow)</option>
        <option value="5">🚶 Walking (brisk)</option>
        <option value="8" selected>🏃 Running (moderate)</option>
        <option value="11">🏃 Running (fast)</option>
        <option value="6">🚴 Cycling (moderate)</option>
        <option value="10">🚴 Cycling (intense)</option>
        <option value="7">🏊 Swimming</option>
        <option value="5">🧘 Yoga</option>
        <option value="8">💪 Weight Training</option>
        <option value="9">🥊 HIIT / Boxing</option>
        <option value="6">⚽ Football / Soccer</option>
        <option value="7">🏸 Badminton</option>
        <option value="4">🕺 Dancing</option>
        <option value="3">🧹 Household chores</option>
        <option value="4">🪜 Climbing stairs</option>
      </select>
    </div>
    <button class="btn" onclick="calculate()">Calculate Calories Burned →</button>
  </div>
  <div class="result-card" id="result">
    <div class="cal-label">Calories Burned</div>
    <div class="cal-num" id="calories">0</div>
    <div class="cal-sub" id="calSub"></div>
    <div class="result-grid">
      <div class="r-item"><div class="r-label">Per Minute</div><div class="r-val" id="perMin">0</div></div>
      <div class="r-item"><div class="r-label">Weekly (5x)</div><div class="r-val" id="weekly">0</div></div>
      <div class="r-item"><div class="r-label">To lose 1kg</div><div class="r-val" id="toLose">0 sessions</div></div>
    </div>
    <div class="tip-box" id="tipBox"></div>
  </div>
</div>
<script>
function calculate(){
  const w=parseFloat(document.getElementById('weight').value)||70;
  const dur=parseFloat(document.getElementById('duration').value)||30;
  const met=parseFloat(document.getElementById('activity').value)||8;
  const cals=Math.round(met*w*dur/60*0.98);
  const perMin=(cals/dur).toFixed(1);
  const weekly=cals*5;
  const sessions=Math.ceil(7700/cals);
  document.getElementById('calories').textContent=cals;
  document.getElementById('calSub').textContent=`In ${dur} minutes of activity`;
  document.getElementById('perMin').textContent=perMin+' kcal';
  document.getElementById('weekly').textContent=weekly.toLocaleString('en-IN')+' kcal';
  document.getElementById('toLose').textContent=sessions+' sessions';
  document.getElementById('tipBox').innerHTML=`<strong>💡 Fat Loss Fact:</strong> To lose 1kg of fat, you need to burn ~7,700 extra calories. At this rate, doing this activity 5x a week, you'd lose 1kg every <strong>${Math.ceil(7700/weekly)} weeks</strong>. Combine with a slight calorie deficit for faster results!`;
  const res=document.getElementById('result');res.classList.add('show');res.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
